[project]
name = "frontdesk-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "slowapi>=0.1.10",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # D-028: exact message only; httpx2 deliberately not installed (unverified package name).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
